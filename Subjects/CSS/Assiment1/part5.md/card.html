```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over Scoreboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Main Stadium Background */
        .stadium {
            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 4% 35px;

            background:
                radial-gradient(ellipse at 50% 30%,
                    rgba(84, 100, 73, 0.65),
                    transparent 50%),
                linear-gradient(
                    to bottom,
                    #07172d 0%,
                    #101e2b 36%,
                    #25302a 58%,
                    #081a0b 100%
                );
        }

        /* Stadium Lights */
        .stadium::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(ellipse at 10% 10%,
                    rgba(55, 132, 207, 0.16), transparent 30%),
                radial-gradient(ellipse at 90% 10%,
                    rgba(55, 132, 207, 0.13), transparent 30%),
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 29px,
                    rgba(255, 255, 255, 0.025) 30px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 29px,
                    rgba(255, 255, 255, 0.025) 30px
                );

            z-index: 0;
        }

        /* Ground */
        .ground {
            position: absolute;
            left: -15%;
            bottom: -30%;
            width: 130%;
            height: 57%;
            border-radius: 50% 50% 0 0;

            background:
                radial-gradient(
                    ellipse at center,
                    #25451b 0%,
                    #10250e 52%,
                    #06120a 100%
                );

            border-top: 10px solid rgba(150, 160, 151, 0.18);
            box-shadow: 0 -12px 25px rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        /* Logo */
        .logo {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-bottom: 70px;
            line-height: 0.85;
        }

        .logo-icon {
            font-size: 35px;
            transform: rotate(-20deg);
        }

        .logo-text {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -1px;
            text-align: left;
        }

        /* Scoreboard Layout */
        .scoreboard {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 7%;
            width: 100%;
            max-width: 890px;
        }

        /* Team Cards */
        .team {
            flex: 1;
            min-width: 0;
            height: 322px;
            border-radius: 19px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 45px 15px 20px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .india {
            background: linear-gradient(
                145deg,
                rgba(24, 111, 211, 0.88),
                rgba(13, 91, 190, 0.88)
            );
        }

        .pakistan {
            background: linear-gradient(
                145deg,
                rgba(66, 191, 39, 0.92),
                rgba(53, 174, 32, 0.92)
            );
        }

        .team-name {
            font-size: clamp(38px, 6vw, 76px);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 42px;
        }

        /* Six Ball Scores */
        .balls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            width: 100%;
            flex-wrap: nowrap;
            margin-bottom: 25px;
        }

        .ball {
            width: 43px;
            height: 43px;
            min-width: 0;
            flex: 1;
            max-width: 44px;
            border-radius: 50%;
            background: #fff;
            color: #080808;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            font-weight: 800;
        }

        /* Total Score */
        .total {
            font-size: clamp(27px, 3.5vw, 43px);
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
        }

        /* Bottom Buttons */
        .controls {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 48px;
            margin-top: 68px;
        }

        .control-btn {
            width: 88px;
            height: 88px;
            border: 4px solid white;
            border-radius: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.25),
                inset 0 0 0 2px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s, filter 0.2s;
        }

        .control-btn:hover {
            transform: translateY(-4px);
            filter: brightness(1.1);
        }

        .bat-btn {
            background: #ffb92e;
        }

        .reset-btn {
            background: #e8242b;
        }

        .control-btn svg {
            width: 55px;
            height: 55px;
            fill: white;
        }

        /* Responsive Design */
        @media (max-width: 650px) {
            .stadium {
                padding: 20px 14px 30px;
            }

            .logo {
                margin-bottom: 55px;
            }

            .scoreboard {
                gap: 14px;
            }

            .team {
                height: 260px;
                padding: 35px 8px 15px;
                border-radius: 15px;
            }

            .team-name {
                font-size: clamp(32px, 8vw, 48px);
                margin-bottom: 35px;
            }

            .balls {
                gap: 4px;
                margin-bottom: 24px;
            }

            .ball {
                font-size: clamp(14px, 3.5vw, 21px);
                aspect-ratio: 1;
                height: auto;
            }

            .total {
                font-size: clamp(23px, 5vw, 32px);
            }

            .controls {
                gap: 30px;
                margin-top: 60px;
            }

            .control-btn {
                width: 72px;
                height: 72px;
                border-radius: 23px;
            }

            .control-btn svg {
                width: 44px;
                height: 44px;
            }
        }

        @media (max-width: 380px) {
            .scoreboard {
                gap: 9px;
            }

            .team {
                padding-left: 5px;
                padding-right: 5px;
                height: 230px;
            }

            .team-name {
                margin-bottom: 30px;
            }

            .balls {
                gap: 3px;
                margin-bottom: 22px;
            }

            .ball {
                font-size: 13px;
            }

            .total {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="stadium">

        <div class="ground"></div>

        <!-- Super Over Logo -->
        <header class="logo">
            <div class="logo-icon">🏏</div>
            <div class="logo-text">
                SUPER<br>OVER
            </div>
        </header>

        <!-- Scoreboard -->
        <main class="scoreboard">

            <!-- India -->
            <section class="team india">
                <h1 class="team-name">IND</h1>

                <div class="balls">
                    <span class="ball">4</span>
                    <span class="ball">3</span>
                    <span class="ball">2</span>
                    <span class="ball">6</span>
                    <span class="ball">6</span>
                    <span class="ball">6</span>
                </div>

                <div class="total">27/0</div>
            </section>

            <!-- Pakistan -->
            <section class="team pakistan">
                <h1 class="team-name">PAK</h1>

                <div class="balls">
                    <span class="ball">2</span>
                    <span class="ball">4</span>
                    <span class="ball">0</span>
                    <span class="ball">3</span>
                    <span class="ball">1</span>
                    <span class="ball">4</span>
                </div>

                <div class="total">14/0</div>
            </section>

        </main>

        <!-- Bottom Controls -->
        <div class="controls">

            <!-- Bat Button -->
            <button class="control-btn bat-btn" aria-label="Bat">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <g transform="rotate(40 32 32)">
                        <path d="M26 5 Q32 1 38 5 L38 38
                                 Q38 43 34 47 L34 56
                                 Q32 61 30 56 L30 47
                                 Q26 43 26 38 Z"/>
                    </g>
                </svg>
            </button>

            <!-- Reset Button -->
            <button class="control-btn reset-btn"
                    aria-label="Reset"
                    onclick="location.reload()">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 8 A24 24 0 1 1 10 42
                             L17 39
                             A17 17 0 1 0 18 19
                             L27 19
                             L13 32
                             L1 19
                             L10 19
                             A24 24 0 0 1 32 8 Z"/>
                </svg>
            </button>

        </div>

    </div>

</body>
</html>
```
