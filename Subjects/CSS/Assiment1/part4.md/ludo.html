
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 20px;
    font-family: Arial, sans-serif;
}

.ludo-board {
    width: min(80vw, 614px);
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(15, minmax(0, 1fr));
    grid-template-rows: repeat(15, minmax(0, 1fr));
    border: 1px solid #222;
}

/* Four home corners */
.home {
    display: flex;
    justify-content: center;
    align-items: center;
}

.red-home {
    grid-area: 1 / 1 / 7 / 7;
    background: red;
}

.green-home {
    grid-area: 1 / 10 / 7 / 16;
    background: green;
}

.blue-home {
    grid-area: 10 / 1 / 16 / 7;
    background: blue;
}

.yellow-home {
    grid-area: 10 / 10 / 16 / 16;
    background: yellow;
}

/* Inner white squares */
.home-inner {
    width: 60%;
    height: 60%;
    background: white;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    place-items: center;
    padding: 8%;
    gap: 10%;
}

/* Four tokens in each home */
.token {
    width: 75%;
    aspect-ratio: 1;
    border: 4px solid;
    border-radius: 50%;
    background: white;
}

.red-home .token {
    border-color: red;
}

.green-home .token {
    border-color: green;
}

.blue-home .token {
    border-color: blue;
}

.yellow-home .token {
    border-color: yellow;
}

/* All track sections */
.track {
    grid-area: 1 / 7 / 7 / 10;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(6, 1fr);
}

.bottom-track {
    grid-area: 10 / 7 / 16 / 10;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(6, 1fr);
}

.left-track {
    grid-area: 7 / 1 / 10 / 7;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(3, 1fr);
}

.right-track {
    grid-area: 7 / 10 / 10 / 16;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(3, 1fr);
}

/* Individual cells */
.cell {
    border: 1px solid #222;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
}

.red-path {
    background: red;
}

.green-path {
    background: green;
}

.blue-path {
    background: blue;
}

.yellow-path {
    background: yellow;
}

.star {
    font-size: clamp(10px, 2.8vw, 25px);
    color: black;
    line-height: 1;
}

/* Centre: four triangles */
.center {
    grid-area: 7 / 7 / 10 / 10;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: white;
}

/* Each triangle fills the centre square */
.triangle {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.triangle-green {
    background: green;
    clip-path: polygon(0 0, 100% 0, 50% 50%);
}

.triangle-red {
    background: red;
    clip-path: polygon(0 0, 0 100%, 50% 50%);
}

.triangle-yellow {
    background: yellow;
    clip-path: polygon(100% 0, 100% 100%, 50% 50%);
}

.triangle-blue {
    background: blue;
    clip-path: polygon(0 100%, 100% 100%, 50% 50%);
}

/* Responsive */
@media (max-width: 500px) {
    body {
        padding: 10px;
    }

    .ludo-board {
        width: 96vw;
    }

    .token {
        border-width: 2px;
    }

    .cell {
        border-width: 0.5px;
    }
}
</style>
</head>

<body>

<div class="ludo-board">

    <!-- RED HOME -->
    <div class="home red-home">
        <div class="home-inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- GREEN HOME -->
    <div class="home green-home">
        <div class="home-inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- BLUE HOME -->
    <div class="home blue-home">
        <div class="home-inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- YELLOW HOME -->
    <div class="home yellow-home">
        <div class="home-inner">
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
            <div class="token"></div>
        </div>
    </div>

    <!-- TOP TRACK -->
    <div class="track">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-path"></div>
        <div class="cell green-path"><span class="star">★</span></div>

        <div class="cell green-path"><span class="star">★</span></div>
        <div class="cell green-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-path"></div>
        <div class="cell"></div>
    </div>

    <!-- BOTTOM TRACK -->
    <div class="bottom-track">
        <div class="cell"></div>
        <div class="cell blue-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-path"></div>
        <div class="cell blue-path"><span class="star">★</span></div>

        <div class="cell blue-path"><span class="star">★</span></div>
        <div class="cell blue-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <!-- LEFT TRACK -->
    <div class="left-track">
        <div class="cell"></div>
        <div class="cell red-path"><span class="star">★</span></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell red-path"></div>
        <div class="cell red-path"></div>
        <div class="cell red-path"></div>
        <div class="cell red-path"></div>
        <div class="cell red-path"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell red-path"><span class="star">★</span></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <!-- RIGHT TRACK -->
    <div class="right-track">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-path"><span class="star">★</span></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell yellow-path"></div>
        <div class="cell yellow-path"></div>
        <div class="cell yellow-path"></div>
        <div class="cell yellow-path"></div>
        <div class="cell yellow-path"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-path"><span class="star">★</span></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <!-- CENTRE TRIANGLES -->
    <div class="center">
        <div class="triangle triangle-green"></div>
        <div class="triangle triangle-red"></div>
        <div class="triangle triangle-yellow"></div>
        <div class="triangle triangle-blue"></div>
    </div>

</div>

</body>
</html>
