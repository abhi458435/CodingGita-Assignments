
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Puzzle</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 38px;
        }

        .sudoku-section {
            min-width: 0;
        }

        h1 {
            text-align: center;
            font-size: clamp(20px, 3vw, 30px);
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 22px;
            color: #222222;
        }

        .sudoku-grid {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            grid-template-rows: repeat(9, minmax(0, 1fr));
            border: 2px solid #222222;
        }

        .cell {
            min-width: 0;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #999999;
            border-bottom: 1px solid #999999;
            color: #292929;
            font-size: clamp(12px, 2.5vw, 24px);
            font-weight: 400;
            background: #ffffff;
        }

        /* Green highlighted cells */
        .green {
            background-color: #a8d9bd;
        }

        /* Bold borders after every 3 cells */
        .cell:nth-child(3n) {
            border-right: 2px solid #222222;
        }

        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell:nth-child(n + 19):nth-child(-n + 27),
        .cell:nth-child(n + 46):nth-child(-n + 54) {
            border-bottom: 2px solid #222222;
        }

        .cell:nth-child(n + 73) {
            border-bottom: none;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 24px 12px;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 35px;
                max-width: 420px;
            }

            h1 {
                margin-bottom: 14px;
            }

            .cell {
                font-size: clamp(16px, 4.5vw, 24px);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Sudoku Puzzle -->
        <section class="sudoku-section">
            <h1>SUDOKU</h1>
            <div class="sudoku-grid" id="puzzle"></div>
        </section>

        <!-- Sudoku Answer -->
        <section class="sudoku-section">
            <h1>ANSWER</h1>
            <div class="sudoku-grid" id="answer"></div>
        </section>

    </main>

    <script>
        const puzzle = [
            [8, 0, 6, 0, 0, 3, 0, 9, 0],
            [0, 4, 0, 0, 1, 0, 0, 6, 8],
            [2, 0, 0, 8, 7, 0, 0, 0, 5],
            [1, 0, 8, 0, 0, 5, 0, 2, 0],
            [0, 3, 0, 1, 0, 0, 0, 5, 0],
            [7, 0, 5, 0, 3, 0, 9, 0, 0],
            [0, 2, 1, 0, 0, 7, 0, 4, 0],
            [6, 0, 0, 0, 2, 0, 8, 0, 0],
            [0, 8, 7, 6, 0, 4, 0, 0, 3]
        ];

        const solution = [
            [8, 7, 6, 5, 4, 3, 1, 9, 2],
            [5, 4, 3, 2, 1, 9, 7, 6, 8],
            [2, 1, 9, 8, 7, 6, 4, 3, 5],
            [1, 9, 8, 7, 6, 5, 3, 2, 4],
            [4, 3, 2, 1, 9, 8, 6, 5, 7],
            [7, 6, 5, 4, 3, 2, 9, 8, 1],
            [3, 2, 1, 9, 8, 7, 5, 4, 6],
            [6, 5, 4, 3, 2, 1, 8, 7, 9],
            [9, 8, 7, 6, 5, 4, 2, 1, 3]
        ];

        // Green areas shown in the reference image
        function isGreen(row, col) {
            return (
                (row <= 2 && col >= 3 && col <= 5) ||
                (row >= 3 && row <= 5 &&
                    (col <= 2 || col >= 6)) ||
                (row >= 6 && col >= 3 && col <= 5)
            );
        }

        function createGrid(data, gridId, showAnswer) {
            const grid = document.getElementById(gridId);

            data.forEach((row, r) => {
                row.forEach((value, c) => {
                    const cell = document.createElement("div");
                    cell.classList.add("cell");

                    if (isGreen(r, c)) {
                        cell.classList.add("green");
                    }

                    if (value !== 0) {
                        cell.textContent = value;
                    }

                    grid.appendChild(cell);
                });
            });
        }

        createGrid(puzzle, "puzzle", false);
        createGrid(solution, "answer", true);
    </script>

</body>
</html>
