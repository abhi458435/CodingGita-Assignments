<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
  box-sizing: border-box;
}

.navbar {
  display: block;
  width: 100%;
  height: 80px;
  padding: 0 30px;
  background: #222;
  color: white;
  display: flex;
  justify-content: space-around;
  align-items: center;
  flex-wrap: wrap;
  
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.nav-links {
  display: block;
  list-style: disc;
  padding: 0;
  margin: 0;
  gap: 30px;
  display: flex;
}

.nav-links li {
  display: block;
}

.auth-buttons {
  display: block;
  gap: 10px;
  /* display: flex; */

}

button {
  padding: 10px 18px;
  gap: 10px;
  
}  
    </style>
</head>
<body>
    <header class="navbar">
  <div class="logo">CodeAcademy</div>

  <ul class="nav-links">
    <li>Home</li>
    <li>Courses</li>
    <li>Projects</li>
    <li>Contact</li>
  </ul>

  <div class="auth-buttons">
    <button>Login</button>
    <button>Signup</button>
  </div>
</header>
    
</body>
</html>
