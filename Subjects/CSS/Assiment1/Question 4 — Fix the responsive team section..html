<html lang="en">
<head>

    <style>
        .team {
  display: flex;
  flex-flow: row wrap;
  width: 100%;
  gap: 20px;

}

.member {
  flex: 1 0 280px;
  min-width: 280px;
  padding: 20px;
  border: 1px solid #999;
  background: #f5f5f5;
  
}

.member:nth-child(3) {
  order: 1;
  
}

.member:nth-child(1) {
  order: 2;
   
}

.member:nth-child(2) {
  order: 3;
 
}

.member:nth-child(4) {
  order: 4;
   
}
        
    </style>
</head>
<body>

  </article>

  <article class="member">

  </article>

  <article class="member">

    <p>Team Leader</p>
  </article>

  <article class="member">

  </article>
</section>

    
</body>
</html>
